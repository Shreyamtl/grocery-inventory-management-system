apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-deployment
  namespace: grocery-app
  labels:
    app: grocery-inventory
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grocery-inventory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: grocery-inventory
    spec:
      containers:
        - name: grocery-container
          image: Shreyamtl/grocery-inventory:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/items/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/items/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
